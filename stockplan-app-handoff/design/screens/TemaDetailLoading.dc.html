.vc-gh{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #E7E5E4;background:#FAFAF9}
.vc-row{display:grid;grid-template-columns:270px minmax(0,1fr);border-bottom:1px solid #F0EEEC}

.xm{display:flex;flex-direction:column;border:1px solid #F0EEEC;border-radius:12px;overflow:hidden}
.xm-row{display:grid;grid-template-columns:150px minmax(0,1fr) 84px;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #F0EEEC;min-height:52px}
.xm-row:last-child{border-bottom:0}
.xm-head{background:#FAFAF9}
.xm-track{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:4px}
@keyframes sk{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.sk{border-radius:6px;background:#F0EEED;background-image:linear-gradient(90deg,#F0EEED 0px,#F7F5F4 40px,#F0EEED 80px);background-size:200px 100%;animation:sk 1.4s ease-in-out infinite}
.circ{border-radius:999px;flex:none}
.row{display:flex;gap:10px;align-items:center}
