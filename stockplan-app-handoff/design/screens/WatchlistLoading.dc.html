<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#1C1917}a:hover{color:#57534E}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid #1C1917;outline-offset:2px}
.nv{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:8px;font-size:14px;color:#57534E;text-decoration:none;border:1px solid transparent}
.nv:hover{background:#F5F5F4;color:#1C1917}
.nv-on,.nv-on:hover{background:#FFFFFF;color:#1C1917;font-weight:600;border-color:#E7E5E4;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sec{font-size:11px;font-weight:600;color:#716A65;padding:16px 10px 6px;text-transform:uppercase;letter-spacing:.06em}
.srch{display:flex;align-items:center;gap:8px;height:40px;min-width:260px;border:1px solid #E7E5E4;border-radius:8px;padding:0 10px;background:#FFFFFF;color:#716A65;font-size:14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-p{background:#FEA722;color:#1C1917}.btn-p:hover{background:#F59E0B;color:#1C1917}
.btn-o{background:#FFFFFF;color:#1C1917;border-color:#E7E5E4}.btn-o:hover{background:#F5F5F4;color:#1C1917}
.btn-g{background:transparent;color:#57534E}.btn-g:hover{background:#F5F5F4;color:#1C1917}
.btn-s{min-height:34px;padding:0 12px;font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(125deg,#FFF6E6 0%,#FFFBF4 45%,#FFFFFF 100%);border:1px solid #F3E2C2;padding:22px 24px;display:flex;gap:28px;flex-wrap:wrap;align-items:center}
.hero-dec{position:absolute;top:-60px;right:-40px;width:240px;height:240px;pointer-events:none}
.kick{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#92400E;letter-spacing:.06em;text-transform:uppercase}
.big{font-size:36px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.big small{font-size:15px;font-weight:500;color:#716A65;letter-spacing:0;margin-left:8px}
.pipe{display:flex;gap:4px;height:12px;border-radius:999px;overflow:hidden;background:#F2F0EE}
.pipe>span{height:100%;transition:width .3s}
.p-baru{background:#D6D3D1}.p-pel{background:#FEA722}.p-siap{background:#15803D}
.pl{display:flex;gap:8px;flex-wrap:wrap}
.pl-b{display:inline-flex;align-items:center;gap:7px;border:1px solid #F1E3C9;background:rgba(255,255,255,.85);border-radius:10px;padding:6px 10px;font-size:13px;color:#44403C;cursor:pointer}
.pl-b:hover{border-color:#E7D3AE;background:#FFFFFF}
.pl-b i{width:9px;height:9px;border-radius:3px;display:block}
.pl-b b{font-weight:700;color:#1C1917}
.pl-on,.pl-on:hover{border-color:#1C1917;background:#FFFFFF;box-shadow:0 0 0 1px #1C1917}
.hs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1 1 300px;position:relative}
.st{background:rgba(255,255,255,.9);border:1px solid #F1E3C9;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.st-ic{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.st b{font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.st>span{font-size:12.5px;color:#716A65}
.ic-g{background:#F0FDF4;color:#15803D}.ic-a{background:#FFF4E2;color:#92400E}

/* toolbar */
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid #E7E5E4;background:#FFFFFF;color:#57534E;font-size:13px;font-weight:500;cursor:pointer}
.tab:hover{background:#F5F5F4;color:#1C1917}
.tab-on,.tab-on:hover{background:#1C1917;border-color:#1C1917;color:#FFFFFF}
.tab em{font-style:normal;font-family:'Geist Mono',monospace;font-size:11px;opacity:.7}
.seg{display:inline-flex;padding:3px;background:#F2F0EE;border-radius:10px;gap:2px}
.sb{border:0;background:transparent;min-height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:#57534E;cursor:pointer}
.sb-on{background:#FFFFFF;color:#1C1917;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#92400E;background:#FFF4E2;border:1px solid #FCDDA8;border-radius:999px;padding:0 6px 0 10px;line-height:26px}
.fchip button{border:0;background:transparent;color:#92400E;cursor:pointer;width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.fchip button:hover{background:#FCDDA8}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cd{border:1px solid #E7E5E4;border-radius:16px;background:#FFFFFF;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;transition:box-shadow .15s,border-color .15s}
.cd:hover{box-shadow:0 10px 28px -16px rgba(28,25,23,.35);border-color:#D6D3D1}
.cd-siap{border-color:#BBF7D0;background:linear-gradient(180deg,#F6FEF8 0%,#FFFFFF 40%)}
.cd-stale{border-style:dashed;border-color:#E7D3AE}
.cd-h{display:flex;align-items:flex-start;gap:10px}
.cd-h img,.cd-h .ini{width:42px;height:42px;border-radius:11px;border:1px solid #E7E5E4;background:#FFFFFF;flex:none}
.ini{display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;font-family:'Geist Mono',monospace;font-size:13px;font-weight:600;border:0 !important}
.cd-t{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1;text-decoration:none;color:#1C1917}
.cd-t:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#D6D3D1}
.cd-t b{font-family:'Geist Mono',monospace;font-size:15px}
.cd-t>span{font-size:12.5px;color:#716A65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:0 9px;line-height:22px;border-radius:999px;white-space:nowrap}
.sp i{width:6px;height:6px;border-radius:999px;background:currentColor;display:block}
.sp-baru{background:#F5F5F4;color:#57534E}.sp-pel{background:#FFF4E2;color:#92400E}.sp-siap{background:#DCFCE7;color:#15803D}
.x{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:#A8A29E;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;margin:-4px -6px 0 0}
.x:hover{background:#F5F5F4;color:#B91C1C}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tm{font-size:11.5px;font-weight:600;color:#44403C;background:#FAFAF9;border:1px solid #E7E5E4;border-radius:6px;padding:0 7px;line-height:20px;text-decoration:none;cursor:pointer}
.tm:hover{border-color:#D6D3D1;color:#1C1917}
.sg{font-size:10.5px;font-weight:600;padding:0 6px;line-height:18px;border-radius:5px}
.sg-Hulu{background:#1C1917;color:#FFFFFF}.sg-Tengah{background:#FEA722;color:#1C1917}.sg-Hilir{background:#FCDDA8;color:#78350F}
.why{border-left:3px solid #FCDDA8;padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:2px}
.why>small{font-size:10.5px;font-weight:700;color:#92400E;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
.why p{margin:0;font-size:13.5px;color:#44403C;line-height:1.5}
.why-e{border:0;background:transparent;color:#A8A29E;cursor:pointer;font-size:11.5px;font-weight:600;text-transform:none;letter-spacing:0;padding:0;display:inline-flex;align-items:center;gap:4px}
.why-e:hover{color:#1C1917}
.ta{width:100%;min-height:62px;border:1px solid #D6D3D1;border-radius:9px;padding:8px 10px;font-size:13.5px;line-height:1.5;resize:vertical;color:#1C1917}
.ta:focus{outline:none;border-color:#1C1917;box-shadow:0 0 0 3px rgba(28,25,23,.1)}
.ed-a{display:flex;gap:6px;justify-content:flex-end}
.pg{display:flex;flex-direction:column;gap:8px}
.pg-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#716A65}
.pg-h b{color:#1C1917;font-weight:600}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.segs>span{height:6px;border-radius:999px;background:#F0EEEC;transition:background .2s}
.segs>.s-on{background:#FEA722}
.cd-siap .segs>.s-on{background:#15803D}
.cl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ck{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #F0EEEC;border-radius:9px;background:#FFFFFF;cursor:pointer;font-size:12.5px;color:#57534E;text-align:left;line-height:1.3}
.ck:hover{border-color:#E7E5E4;background:#FAFAF9}
.ck>.bx{width:16px;height:16px;border-radius:5px;border:1.5px solid #D6D3D1;display:inline-flex;align-items:center;justify-content:center;flex:none;color:transparent;background:#FFFFFF}
.ck-on{color:#1C1917;background:#FAFAF9}
.ck-on>.bx{background:#1C1917;border-color:#1C1917;color:#FFFFFF}
.sig{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#44403C;background:#EFF6FF;border:1px solid #DBEAFE;border-radius:9px;padding:7px 10px;text-decoration:none}
.sig:hover{border-color:#BFDBFE;color:#1C1917}
.sig>i{width:7px;height:7px;border-radius:999px;background:#1D4ED8;flex:none;animation:pulse 2s ease-in-out infinite}
.sig>em{font-style:normal;color:#716A65;margin-left:auto;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(29,78,216,.35)}50%{box-shadow:0 0 0 4px rgba(29,78,216,0)}}
.stale{display:flex;gap:6px;align-items:center;font-size:12px;color:#92400E}
.cd-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid #F5F4F2;margin-top:auto}
.cd-f>span{font-size:12px;color:#716A65}
.cd-a{display:flex;gap:6px}

/* rail */
.rail{display:flex;flex-direction:column;gap:14px}
.rc{border:1px solid #E7E5E4;border-radius:16px;background:#FFFFFF;padding:16px;display:flex;flex-direction:column;gap:12px}
.rc h3{margin:0;font-size:13px;font-weight:700;color:#44403C;text-transform:uppercase;letter-spacing:.05em}
.ev{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.ev li{display:flex;gap:10px;padding:10px 0;border-top:1px solid #F5F4F2}
.ev li:first-child{border-top:0;padding-top:0}
.ev-tk{font-family:'Geist Mono',monospace;font-size:11.5px;font-weight:600;background:#1C1917;color:#FFFFFF;border-radius:6px;padding:0 6px;line-height:20px;height:20px;flex:none}
.ev-t{display:flex;flex-direction:column;font-size:13px;line-height:1.4;min-width:0}
.ev-t>span{font-size:11.5px;color:#716A65}
.tb2{display:flex;flex-direction:column;gap:9px}
.tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:0;background:transparent;padding:4px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;text-align:left;font:inherit;color:#1C1917}
.tr:hover{background:#FAFAF9}
.tr-on,.tr-on:hover{background:#FFF4E2}
.tr>span{font-size:13px;font-weight:500}
.tr>b{font-size:12px;color:#716A65;font-weight:600}
.tr>i{grid-column:1/-1;height:6px;border-radius:999px;background:#F2F0EE;display:block;position:relative;overflow:hidden}
.tr>i>u{position:absolute;left:0;top:0;bottom:0;background:#1C1917;border-radius:999px}
.tip{border-radius:16px;background:#1C1917;color:#E7E5E4;padding:16px;display:flex;flex-direction:column;gap:8px}
.tip b{color:#FEA722;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tip p{margin:0;font-size:13.5px;line-height:1.55}
.empty{border:1px dashed #D6D3D1;border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1C1917;color:#FFFFFF;padding:8px 8px 8px 16px;border-radius:999px;font-size:13.5px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast button{border:0;background:rgba(255,255,255,.12);color:#FEA722;font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer}
.toast button:hover{background:rgba(255,255,255,.2)}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
@keyframes sk{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.sk{display:block;border-radius:6px;background:#F0EEED;background-image:linear-gradient(90deg,#F0EEED 0px,#F7F5F4 40px,#F0EEED 80px);background-size:200px 100%;animation:sk 1.4s ease-in-out infinite;flex:none}
.sk-d{display:block;border-radius:6px;background:#38332F;background-image:linear-gradient(90deg,#38332F 0px,#48423D 40px,#38332F 80px);background-size:200px 100%;animation:sk 1.4s ease-in-out infinite;flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.sk,.sk-d{animation:none}}
</style>
</helmet>
